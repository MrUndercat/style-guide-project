name: Lint

on:
  pull_request:
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - ".markdownlint.json"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - ".markdownlint.json"

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            docs/**/*.md
            *.md

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
